<svg
  version="1.1"
  width="1024"
  height="1024"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <filter id="noise">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.6"
        numOctaves="2"
        seed="0"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0.5" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="transparent" filter="url(#noise)" />
</svg>
